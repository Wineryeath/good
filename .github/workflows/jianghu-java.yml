name: Java CI

on:
  push:
    paths:
      - "jianghu/**"
      - ".github/workflows/jianghu-java.yml"
  pull_request:
    paths:
      - "jianghu/**"
      - ".github/workflows/jianghu-java.yml"
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jianghu
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Run core tests
        run: gradle :core:test
      - name: Compile desktop client
        run: gradle :lwjgl3:compileJava
      - name: Build desktop ZIP installer
        run: gradle :lwjgl3:distZip
      - name: Upload desktop ZIP
        uses: actions/upload-artifact@v4
        with:
          name: yiren-yijianghu-desktop
          path: jianghu/lwjgl3/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14