name: Java CI

on:
  push:
    paths:
      - "jianghu/**"
      - ".github/workflows/java.yml"
  pull_request:
    paths:
      - "jianghu/**"
      - ".github/workflows/java.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jianghu
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Run core tests
        run: gradle :core:test
      - name: Compile desktop client
        run: gradle :lwjgl3:compileJava
